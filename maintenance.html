<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lightning</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0a0f1f, #1a2a4f);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 100vh;
  text-align: center;
}

.container {
  max-width: 500px;
}

.logo {
  font-size: 50px;
  margin-bottom: 10px;
}

h1 {
  font-size: 28px;
  margin-bottom: 10px;
}

p {
  opacity: 0.7;
}

.bolt {
  animation: flicker 1.5s infinite;
}

@keyframes flicker {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
</style>
</head>

<body>

<div class="container">
  <div class="logo">⚡</div>
  <h1>lightning is down</h1>
  <p>we're working on fixing it.<br>we'll be back in a flash.</p>
  <p class="bolt">thank you for your cooperation.</p>
</div>

</body>
</html>
