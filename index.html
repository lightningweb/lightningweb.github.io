<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lightning</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
–bg:       #0e0e0e;
–bg2:      #161616;
–bg3:      #1e1e1e;
–border:   rgba(255,255,255,0.09);
–border-h: rgba(245,196,60,0.45);
–gold:     #f5c43c;
–gold-d:   rgba(245,196,60,0.12);
–gold-g:   rgba(245,196,60,0.2);
–text:     #e0e0e0;
–text2:    #999;
–muted:    #555;
–muted2:   #888;
–font:     ‘DM Sans’, sans-serif;
–font-d:   ‘Sora’, sans-serif;
}

html { background-color: #0e0e0e; height: 100%; }
body { background-color: #0e0e0e; color: #e0e0e0; font-family: ‘DM Sans’,sans-serif; overflow: hidden; height: 100%; }

#cvs { position: fixed; inset: 0; pointer-events: none; z-index: 0; }

.page {
position: fixed; inset: 0; display: flex; flex-direction: column;
align-items: center; justify-content: center;
z-index: 1; opacity: 0; pointer-events: none;
transition: opacity 0.3s ease; overflow: hidden;
}
.page.active { opacity: 1; pointer-events: all; }

/* HOME */
#home { gap: 0; }
.home-title {
font-family: ‘Sora’,sans-serif; font-size: clamp(2.4rem,5.5vw,4rem);
font-weight: 700; color: #f5c43c; letter-spacing: -0.03em;
line-height: 1; margin-bottom: 8px; text-shadow: 0 0 60px rgba(245,196,60,0.2);
}
.home-sub {
font-size: 0.86rem; font-weight: 300; color: #888;
letter-spacing: 0.04em; margin-bottom: 36px; font-style: italic;
}

.search-bar {
display: flex; align-items: center; background: #161616;
border: 1px solid rgba(255,255,255,0.09); border-radius: 60px;
padding: 9px 9px 9px 20px; width: min(520px,90vw); gap: 10px;
margin-bottom: 36px; transition: border-color 0.2s, box-shadow 0.2s;
}
.search-bar:focus-within { border-color: rgba(245,196,60,0.45); box-shadow: 0 0 0 3px rgba(245,196,60,0.12); }
.search-bar svg { color: #555; flex-shrink: 0; }
#home-search {
flex: 1; background: none; border: none; outline: none;
color: #e0e0e0; font-family: ‘DM Sans’,sans-serif; font-size: 0.92rem; font-weight: 300;
}
#home-search::placeholder { color: #555; }

.engine-wrap { position: relative; }
.engine-select {
display: flex; align-items: center; gap: 5px; background: #1e1e1e;
border: 1px solid rgba(255,255,255,0.09); border-radius: 60px; padding: 6px 12px;
cursor: pointer; font-size: 0.77rem; color: #888; white-space: nowrap;
transition: background 0.15s; user-select: none;
}
.engine-select:hover { background: rgba(255,255,255,0.06); }
.engine-dropdown {
position: absolute; top: calc(100% + 8px); right: 0; background: #161616;
border: 1px solid rgba(255,255,255,0.09); border-radius: 14px; overflow: hidden;
min-width: 148px; display: none; z-index: 99; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
}
.engine-dropdown.open { display: block; }
.engine-opt { padding: 10px 16px; font-size: 0.82rem; color: #888; cursor: pointer; transition: background 0.12s, color 0.12s; }
.engine-opt:hover { background: rgba(255,255,255,0.07); color: #e0e0e0; }
.engine-opt.chosen { color: #f5c43c; }

.go-btn {
width: 38px; height: 38px; border-radius: 50%; background: #f5c43c; border: none;
cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
transition: background 0.15s, transform 0.15s; box-shadow: 0 2px 14px rgba(245,196,60,0.2);
}
.go-btn:hover { background: #ffd966; transform: scale(1.06); }
.go-btn svg { color: #0e0f11; }

.nav-icons { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; justify-content: center; }
.nav-icon { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; }
.nav-circle {
width: 56px; height: 56px; border-radius: 15px; background: #161616;
border: 1px solid rgba(255,255,255,0.09); display: flex; align-items: center;
justify-content: center; color: #999;
transition: background 0.18s, border-color 0.18s, transform 0.18s, color 0.18s;
}
.nav-icon:hover .nav-circle { background: rgba(245,196,60,0.12); border-color: rgba(245,196,60,0.3); transform: translateY(-3px); color: #f5c43c; }
.nav-label { font-size: 0.72rem; color: #888; font-weight: 400; letter-spacing: 0.02em; }

/* GAMES */
#games-page { justify-content: flex-start; overflow: hidden; }
.page-header { width: 100%; display: flex; flex-direction: column; align-items: center; padding: 32px 24px 16px; flex-shrink: 0; gap: 14px; }
.page-search {
display: flex; align-items: center; background: #161616;
border: 1px solid rgba(255,255,255,0.09); border-radius: 60px;
padding: 10px 20px; width: min(460px,90vw); gap: 10px;
transition: border-color 0.2s, box-shadow 0.2s;
}
.page-search:focus-within { border-color: rgba(245,196,60,0.45); box-shadow: 0 0 0 3px rgba(245,196,60,0.12); }
.page-search svg { color: #555; flex-shrink: 0; }
.page-search input { flex: 1; background: none; border: none; outline: none; color: #e0e0e0; font-family: ‘DM Sans’,sans-serif; font-size: 0.88rem; }
.page-search input::placeholder { color: #555; }
.filter-row { display: flex; gap: 8px; }
.chip {
background: #161616; border: 1px solid rgba(255,255,255,0.09); border-radius: 60px;
padding: 5px 16px; font-size: 0.75rem; color: #888; cursor: pointer;
transition: all 0.15s; font-family: ‘DM Sans’,sans-serif;
}
.chip:hover { border-color: rgba(245,196,60,0.3); color: #e0e0e0; }
.chip.active { background: rgba(245,196,60,0.12); border-color: rgba(245,196,60,0.45); color: #f5c43c; }
.games-scroll { flex: 1; width: 100%; overflow-y: auto; padding: 8px 36px 48px; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.07) transparent; }
.games-scroll::-webkit-scrollbar { width: 4px; }
.games-scroll::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.07); border-radius: 2px; }
#game-grid { display: grid; grid-template-columns: repeat(auto-fill,minmax(142px,1fr)); gap: 12px; max-width: 1080px; margin: 0 auto; }
.game-card {
position: relative; border-radius: 18px; overflow: hidden; cursor: pointer; aspect-ratio: 1;
background: #1e1e1e; border: 1px solid rgba(255,255,255,0.09);
transition: transform 0.22s cubic-bezier(.34,1.56,.64,1), box-shadow 0.22s, border-color 0.22s;
animation: pop 0.28s ease both;
}
.game-card:hover { transform: scale(1.045) translateY(-2px); border-color: rgba(245,196,60,0.3); box-shadow: 0 12px 40px rgba(0,0,0,0.6), 0 0 0 1px rgba(245,196,60,0.2); z-index: 2; }
.game-card:hover .card-overlay { opacity: 1; }
.game-card:hover .card-img { filter: brightness(0.45); }
.card-img { width: 100%; height: 100%; object-fit: cover; display: block; transition: filter 0.22s; }
.card-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 2.4rem; background: #1e1e1e; }
.card-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; opacity: 0; transition: opacity 0.22s; }
.card-play { width: 42px; height: 42px; border-radius: 50%; background: #f5c43c; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 20px rgba(245,196,60,0.2); }
.card-play svg { color: #0e0f11; margin-left: 2px; }
.card-name-tip { font-size: 0.7rem; font-weight: 500; color: #fff; text-align: center; padding: 0 8px; line-height: 1.3; max-width: 100%; text-shadow: 0 1px 6px rgba(0,0,0,0.9); }
.badge-new { position: absolute; top: 8px; right: 8px; background: #f5c43c; color: #0e0e0e; font-size: 0.6rem; font-weight: 700; padding: 2px 7px; border-radius: 20px; letter-spacing: 0.05em; text-transform: uppercase; }

/* MODAL */
#modal { display: none; position: fixed; inset: 0; z-index: 200; flex-direction: column; background: #0a0a0a; }
#modal.open { display: flex; }
.modal-bar { display: flex; align-items: center; padding: 10px 16px; gap: 10px; background: #141414; border-bottom: 1px solid rgba(255,255,255,0.09); flex-shrink: 0; }
.modal-title { flex: 1; font-family: ‘Sora’,sans-serif; font-size: 0.88rem; font-weight: 600; color: #e0e0e0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.modal-btn { background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.09); border-radius: 8px; padding: 6px 14px; color: #888; font-family: ‘DM Sans’,sans-serif; font-size: 0.78rem; cursor: pointer; transition: all 0.15s; display: flex; align-items: center; gap: 5px; }
.modal-btn:hover { border-color: rgba(245,196,60,0.45); color: #e0e0e0; }
.modal-btn.close:hover { background: rgba(239,68,68,0.1); border-color: rgba(239,68,68,0.45); color: #f87171; }
#game-frame { flex: 1; width: 100%; border: none; }

.back-btn {
position: fixed; top: 20px; left: 20px; z-index: 10;
display: none; align-items: center; gap: 7px;
background: #161616; border: 1px solid rgba(255,255,255,0.09);
border-radius: 60px; padding: 7px 16px 7px 12px;
cursor: pointer; font-size: 0.8rem; color: #888;
font-family: ‘DM Sans’,sans-serif; transition: all 0.15s;
}
.back-btn:hover { border-color: rgba(245,196,60,0.45); color: #e0e0e0; }
.back-btn.visible { display: flex; }

.empty-state { grid-column: 1/-1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 80px 0; gap: 12px; color: #555; font-size: 0.88rem; }
.empty-state .ei { font-size: 2.4rem; opacity: 0.3; }

@keyframes pop { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }

@media (max-width: 600px) {
#game-grid { grid-template-columns: repeat(auto-fill,minmax(110px,1fr)); }
.games-scroll { padding: 4px 14px 40px; }
.nav-icons { gap: 16px; }
}

/* WELCOME SCREEN */
#welcome {
position: fixed; inset: 0; z-index: 500;
background: #0e0e0e;
display: flex; flex-direction: column;
align-items: center; justify-content: center;
gap: 0;
transition: opacity 0.6s ease, transform 0.6s ease;
}
#welcome.hiding {
opacity: 0;
transform: scale(1.04);
pointer-events: none;
}
#welcome.hidden { display: none; }
.welcome-bolt {
font-size: 3rem; margin-bottom: 16px;
animation: bolt-in 0.7s cubic-bezier(.34,1.56,.64,1) both;
}
@keyframes bolt-in {
from { opacity: 0; transform: scale(0.4) rotate(-20deg); }
to   { opacity: 1; transform: scale(1) rotate(0deg); }
}
.welcome-title {
font-family: ‘Sora’, sans-serif;
font-size: clamp(2.2rem, 6vw, 3.6rem);
font-weight: 700; color: #f5c43c;
letter-spacing: -0.03em; line-height: 1;
margin-bottom: 10px;
animation: fade-up 0.6s 0.15s ease both;
}
.welcome-sub {
font-size: 0.88rem; color: #888; font-style: italic;
font-weight: 300; letter-spacing: 0.04em;
margin-bottom: 40px;
animation: fade-up 0.6s 0.25s ease both;
}
.welcome-btn {
background: #f5c43c; color: #0e0e0e;
font-family: ‘DM Sans’, sans-serif; font-weight: 600;
font-size: 0.9rem; border: none; border-radius: 60px;
padding: 13px 36px; cursor: pointer;
box-shadow: 0 4px 24px rgba(245,196,60,0.3);
transition: background 0.15s, transform 0.15s, box-shadow 0.15s;
animation: fade-up 0.6s 0.38s ease both;
}
.welcome-btn:hover { background: #ffd966; transform: scale(1.04); box-shadow: 0 6px 32px rgba(245,196,60,0.4); }
@keyframes fade-up {
from { opacity: 0; transform: translateY(16px); }
to   { opacity: 1; transform: translateY(0); }
}
</style>

</head>
<body>

<canvas id="cvs"></canvas>

<!-- WELCOME -->

<div id="welcome">
  <div class="welcome-bolt">⚡</div>
  <div class="welcome-title">lightning</div>
  <div class="welcome-sub" id="welcome-sub">browse without limits</div>
  <button class="welcome-btn" id="welcome-btn">get started</button>
</div>

<button class="back-btn" id="back-btn">
  <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
  Home
</button>

<!-- HOME -->

<div class="page active" id="home">
  <div class="home-title">lightning</div>
  <div class="home-sub" id="home-sub">browse without limits</div>

  <div class="search-bar">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
    <input id="home-search" type="text" placeholder="search or enter a url…" autocomplete="off">
    <div class="engine-wrap">
      <div class="engine-select" id="engine-select">
        <span id="engine-label">DuckDuckGo</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
      <div class="engine-dropdown" id="engine-dd">
        <div class="engine-opt chosen" data-engine="https://duckduckgo.com/?q=">DuckDuckGo</div>
        <div class="engine-opt" data-engine="https://www.google.com/search?q=">Google</div>
        <div class="engine-opt" data-engine="https://www.bing.com/search?q=">Bing</div>
        <div class="engine-opt" data-engine="https://search.brave.com/search?q=">Brave</div>
      </div>
    </div>
    <button class="go-btn" id="search-go">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
    </button>
  </div>

  <div class="nav-icons">
    <div class="nav-icon" data-goto="games-page">
      <div class="nav-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="3"/><path d="M6 12h4M8 10v4M15 12h.01M18 12h.01"/></svg>
      </div>
      <span class="nav-label">games</span>
    </div>
    <div class="nav-icon" data-href="https://prism.onl/page/media" data-label="videos">
      <div class="nav-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/><polygon points="10 9 15 12 10 15 10 9"/></svg>
      </div>
      <span class="nav-label">videos</span>
    </div>
    <div class="nav-icon" data-href="https://prism.onl/page/music" data-label="music">
      <div class="nav-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
      </div>
      <span class="nav-label">music</span>
    </div>
    <div class="nav-icon" data-href="https://prism.onl/page/ai" data-label="ai">
      <div class="nav-circle">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M8 14s1.5 2 4 2 4-2 4-2"/><line x1="9" y1="9" x2="9.01" y2="9" stroke-width="2.5" stroke-linecap="round"/><line x1="15" y1="9" x2="15.01" y2="9" stroke-width="2.5" stroke-linecap="round"/></svg>
      </div>
      <span class="nav-label">ai</span>
    </div>
  </div>
</div>

<!-- GAMES -->

<div class="page" id="games-page">
  <div class="page-header">
    <div class="page-search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="game-search" placeholder="search games…" autocomplete="off">
    </div>
    <div class="filter-row">
      <div class="chip active" data-filter="all">All</div>
      <div class="chip" data-filter="new">✦ New</div>
    </div>
  </div>
  <div class="games-scroll">
    <div id="game-grid">
      <div class="empty-state"><div class="ei">⚡</div><span>Loading games…</span></div>
    </div>
  </div>
</div>

<!-- MODAL -->

<div id="modal">
  <div class="modal-bar">
    <div class="modal-title" id="modal-title">—</div>
    <button id="fullscreen-btn" class="modal-btn">
      <svg id="fs-expand" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 00-2 2v3M21 8V5a2 2 0 00-2-2h-3M3 16v3a2 2 0 002 2h3M16 21h3a2 2 0 002-2v-3"/></svg>
      <svg id="fs-shrink" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M8 3v3a2 2 0 01-2 2H3M21 8h-3a2 2 0 01-2-2V3M3 16h3a2 2 0 012 2v3M16 21v-3a2 2 0 012-2h3"/></svg>
      <span id="fs-label">Fullscreen</span>
    </button>
    <button class="modal-btn close" id="close-modal">
      <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      Close
    </button>
  </div>
  <iframe id="game-frame" allow="fullscreen; autoplay; payment"></iframe>
</div>

<script>
'use strict';


/* ── Welcome screen ── */
(function () {
  const overlay = document.getElementById('welcome');
  const btn = document.getElementById('welcome-btn');
  if (localStorage.getItem('lightning_visited')) {
    overlay.classList.add('hidden');
    return;
  }
  btn.addEventListener('click', () => {
    overlay.classList.add('hiding');
    setTimeout(() => {
      overlay.classList.add('hidden');
      localStorage.setItem('lightning_visited', '1');
    }, 650);
  });
})();


/* ── Constellation ── */
(function () {
  const c = document.getElementById('cvs');
  const ctx = c.getContext('2d');
  let pts = [], W, H;
  const N = 80, LINK = 150, PULL_R = 180, PULL_S = 0.022;
  const SPRING = 0.018, DAMP = 0.88, GOLD_R = 130;
  let mx = -9999, my = -9999, smx = -9999, smy = -9999, mouseIn = false;

  window.addEventListener('mousemove', e => { mx = e.clientX; my = e.clientY; mouseIn = true; });
  window.addEventListener('mouseleave', () => { mouseIn = false; mx = -9999; my = -9999; });

  function resize() { W = c.width = innerWidth; H = c.height = innerHeight; }

  function init() {
    resize();
    pts = Array.from({ length: N }, () => {
      const hx = Math.random() * W, hy = Math.random() * H;
      return { x: hx, y: hy, hx, hy, vx: 0, vy: 0,
               r: Math.random() * 1.1 + .35,
               a: Math.random() * Math.PI * 2,
               pa: Math.random() * .005 + .002 };
    });
  }

  function frame() {
    ctx.clearRect(0, 0, W, H);

    if (mouseIn) { smx += (mx - smx) * 0.07; smy += (my - smy) * 0.07; }
    else { smx += (-9999 - smx) * 0.04; smy += (-9999 - smy) * 0.04; }

    if (mouseIn) {
      const g = ctx.createRadialGradient(smx, smy, 0, smx, smy, PULL_R * 1.5);
      g.addColorStop(0, 'rgba(245,196,60,0.055)');
      g.addColorStop(1, 'transparent');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }

    for (const p of pts) {
      p.a += p.pa;
      if (mouseIn) {
        const dx = smx - p.x, dy = smy - p.y, d = Math.sqrt(dx*dx + dy*dy);
        if (d < PULL_R && d > 1) { const f = (1 - d/PULL_R) * PULL_S; p.vx += dx/d*f; p.vy += dy/d*f; }
      }
      p.vx += (p.hx - p.x) * SPRING; p.vy += (p.hy - p.y) * SPRING;
      p.vx *= DAMP; p.vy *= DAMP; p.x += p.vx; p.y += p.vy;
    }

    for (let i = 0; i < pts.length; i++) {
      for (let j = i + 1; j < pts.length; j++) {
        const dx = pts[i].x - pts[j].x, dy = pts[i].y - pts[j].y;
        const d = Math.sqrt(dx*dx + dy*dy);
        if (d >= LINK) continue;
        const t = 1 - d/LINK;
        const near = mouseIn && (Math.hypot(pts[i].x-smx, pts[i].y-smy) < GOLD_R || Math.hypot(pts[j].x-smx, pts[j].y-smy) < GOLD_R);
        ctx.beginPath(); ctx.moveTo(pts[i].x, pts[i].y); ctx.lineTo(pts[j].x, pts[j].y);
        ctx.strokeStyle = near ? `rgba(245,196,60,${t*0.55})` : `rgba(170,165,155,${t*0.09})`;
        ctx.lineWidth = near ? 1 : .55; ctx.stroke();
      }
    }

    for (const p of pts) {
      const near = mouseIn && Math.hypot(p.x-smx, p.y-smy) < GOLD_R;
      const al = (Math.sin(p.a)+1)/2*.45+.1;
      ctx.beginPath(); ctx.arc(p.x, p.y, near ? p.r*1.8 : p.r, 0, Math.PI*2);
      ctx.fillStyle = near ? `rgba(245,196,60,${Math.min(al*2.2,0.9)})` : `rgba(190,185,170,${al})`;
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', () => {
    const sx = innerWidth/(W||innerWidth), sy = innerHeight/(H||innerHeight);
    for (const p of pts) { p.hx *= sx; p.hy *= sy; }
    resize();
  });

  init(); frame();
})();

/* ── Helpers ── */
function resolveUrl(q, engine) {
  if (/^https?:\/\//i.test(q)) return q;
  if (/^[\w-]+(\.[a-z]{2,})(\/|$)/i.test(q)) return 'https://' + q;
  return engine + encodeURIComponent(q);
}

/* ── Quotes ── */
const _fallback = [
  'browse without limits',
  'there\'s only one minute in a minute.',
  'the best time to start was yesterday.',
  'do it anyway.',
  'make it count.',
  'no shortcuts. no excuses.',
  'move fast. stay sharp.',
];
let _quotes = [..._fallback];
setRandomQuote();

fetch('/quotes.txt')
  .then(r => {
    if (!r.ok) throw new Error('quotes.txt not found');
    return r.text();
  })
  .then(txt => {
    const lines = txt.split('\n').map(l => l.trim()).filter(Boolean);
    if (lines.length) { _quotes = lines; setRandomQuote(); }
  })
  .catch(() => { /* use fallback */ });

function setRandomQuote() {
  if (!_quotes.length) return;
  const q = _quotes[Math.floor(Math.random() * _quotes.length)];
  const el = document.getElementById('home-sub');
  const ws = document.getElementById('welcome-sub');
  if (el) el.textContent = q;
  if (ws) ws.textContent = q;
}

/* ── Navigation ── */
const backBtn = document.getElementById('back-btn');
function goTo(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  backBtn.classList.toggle('visible', id !== 'home');
  if (id === 'home') setRandomQuote();
}
backBtn.addEventListener('click', () => goTo('home'));
document.querySelectorAll('[data-goto]').forEach(el =>
  el.addEventListener('click', () => goTo(el.dataset.goto))
);
document.querySelectorAll('[data-href]').forEach(el =>
  el.addEventListener('click', () => openModal(el.dataset.href, el.dataset.label || el.dataset.href))
);

/* ── Engine picker ── */
let engine = 'https://duckduckgo.com/?q=';
document.getElementById('engine-select').addEventListener('click', e => {
  e.stopPropagation();
  document.getElementById('engine-dd').classList.toggle('open');
});
document.querySelectorAll('.engine-opt').forEach(o => {
  o.addEventListener('click', e => {
    e.stopPropagation();
    engine = o.dataset.engine;
    document.getElementById('engine-label').textContent = o.textContent.trim();
    document.querySelectorAll('.engine-opt').forEach(x => x.classList.remove('chosen'));
    o.classList.add('chosen');
    document.getElementById('engine-dd').classList.remove('open');
  });
});
document.addEventListener('click', () => document.getElementById('engine-dd').classList.remove('open'));

/* ── Search ── */
function homeSearch() {
  const q = document.getElementById('home-search').value.trim();
  if (!q) return;
  openModal(resolveUrl(q, engine), q);
}
document.getElementById('search-go').addEventListener('click', homeSearch);
document.getElementById('home-search').addEventListener('keydown', e => { if (e.key === 'Enter') homeSearch(); });

/* ── Modal ── */
function openModal(url, title) {
  document.getElementById('modal-title').textContent = title || url;
  document.getElementById('game-frame').src = '';
  document.getElementById('modal').classList.add('open');
  document.getElementById('game-frame').src = url;
}
function closeModal() {
  document.getElementById('game-frame').src = '';
  document.getElementById('modal').classList.remove('open');
  fsExpand.style.display = ''; fsShrink.style.display = 'none'; fsLabel.textContent = 'Fullscreen';
}
document.getElementById('close-modal').addEventListener('click', closeModal);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ── Fullscreen ── */
const fsBtn = document.getElementById('fullscreen-btn');
const fsExpand = document.getElementById('fs-expand');
const fsShrink = document.getElementById('fs-shrink');
const fsLabel = document.getElementById('fs-label');
const gameFrame = document.getElementById('game-frame');
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) gameFrame.requestFullscreen?.() || gameFrame.webkitRequestFullscreen?.();
  else document.exitFullscreen?.() || document.webkitExitFullscreen?.();
});
function updateFs() {
  const f = !!document.fullscreenElement;
  fsExpand.style.display = f ? 'none' : ''; fsShrink.style.display = f ? '' : 'none';
  fsLabel.textContent = f ? 'Exit' : 'Fullscreen';
}
document.addEventListener('fullscreenchange', updateFs);
document.addEventListener('webkitfullscreenchange', updateFs);

/* ── Games ── */
let allGames = [], gFilter = 'all', gQuery = '';
const esc = s => String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');

function renderGames() {
  let list = allGames;
  if (gFilter === 'new') list = list.filter(g => g.new);
  if (gQuery) { const q = gQuery.toLowerCase(); list = list.filter(g => (g.title??g.name??g.id??'').toLowerCase().includes(q)); }
  document.querySelector('.chip[data-filter="all"]').textContent = `All ${allGames.length}`;
  const grid = document.getElementById('game-grid');
  if (!list.length) { grid.innerHTML = `<div class="empty-state"><div class="ei">🕹️</div><span>No games found</span></div>`; return; }
  grid.innerHTML = list.map((g, i) => {
    const name = g.title??g.name??g.id??'Unknown';
    const thumb = g.thumbnail??g.image??'';
    const url = g.file??g.url??'';
    return `<div class="game-card" data-url="${esc(url)}" data-name="${esc(name)}" style="animation-delay:${Math.min(i*10,500)}ms">
      ${thumb ? `<img class="card-img" src="${esc(thumb)}" alt="${esc(name)}" loading="lazy" onerror="this.outerHTML='<div class=card-placeholder>🎮</div>'">` : `<div class="card-placeholder">🎮</div>`}
      ${g.new ? `<div class="badge-new">new</div>` : ''}
      <div class="card-overlay"><div class="card-play"><svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg></div><div class="card-name-tip">${esc(name)}</div></div>
    </div>`;
  }).join('');
  grid.querySelectorAll('.game-card').forEach(card =>
    card.addEventListener('click', () => openModal(card.dataset.url, card.dataset.name))
  );
}

fetch('/games.json')
  .then(r => r.json())
  .then(data => { allGames = data; renderGames(); })
  .catch(() => { document.getElementById('game-grid').innerHTML = `<div class="empty-state"><div class="ei">⚠️</div><span>Failed to load games</span></div>`; });

document.getElementById('game-search').addEventListener('input', e => { gQuery = e.target.value.trim(); renderGames(); });
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  document.querySelectorAll('.chip').forEach(x => x.classList.remove('active'));
  c.classList.add('active'); gFilter = c.dataset.filter; renderGames();
}));
</script>

</body>
</html>
