<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Lightning has moved</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      background: linear-gradient(180deg, #0a0a0a, #111111);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: "DM Sans", -apple-system, BlinkMacSystemFont, sans-serif;
    }

    .container {
      text-align: center;
      max-width: 600px;
      padding: 40px;
      animation: fadeIn 0.8s ease;
    }

    h1 {
      font-family: "Sora", sans-serif;
      font-size: 3rem;
      font-weight: 700;
      color: #facc15;
      margin-bottom: 16px;
      letter-spacing: -1px;
    }

    p {
      font-size: 1.2rem;
      color: #e5e5e5;
      font-weight: 400;
    }

    .note {
      margin-top: 16px;
      font-size: 0.9rem;
      color: #888;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    body::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(250,204,21,0.08), transparent);
      top: -100px;
      right: -100px;
      animation: float 6s ease-in-out infinite alternate;
    }

    @keyframes float {
      from { transform: translate(0, 0); }
      to { transform: translate(-40px, 40px); }
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>⚡ Lightning has moved</h1>
    <p>
      A faster, cleaner, and more powerful version is now available.
    </p>
    <div class="note">
      Redirecting you now...
    </div>
  </div>

  <script>
    setTimeout(() => {
      window.location.href = "https://lightningontop.vercel.app";
    }, 2000);
  </script>
</body>
</html>
