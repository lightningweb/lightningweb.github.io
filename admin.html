<!DOCTYPE html>
<html>
<head>
<title>Lightning Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: radial-gradient(circle at top, #1a2a4f, #0a0f1f);
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* Panel */
.panel {
  background: rgba(255, 255, 255, 0.05);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 40px;
  width: 320px;
  text-align: center;
  box-shadow: 0 10px 40px rgba(0,0,0,0.4);
}

/* Title */
h1 {
  margin: 0 0 20px;
  font-weight: 600;
}

/* Row */
.row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 30px;
}

/* Label */
.label {
  font-size: 16px;
  opacity: 0.8;
}

/* Toggle */
.toggle {
  width: 60px;
  height: 32px;
  background: #333;
  border-radius: 20px;
  position: relative;
  cursor: pointer;
  transition: 0.3s;
}

.circle {
  width: 26px;
  height: 26px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: 0.3s;
}

/* ON state */
.on {
  background: linear-gradient(135deg, #00ff9c, #00c3ff);
}

.on .circle {
  left: 31px;
}

/* Status text */
.status {
  margin-top: 20px;
  font-size: 14px;
  opacity: 0.7;
}

/* Glow when ON */
.on-glow {
  box-shadow: 0 0 20px rgba(0,255,150,0.5);
}
</style>
</head>

<body>

<div class="panel">
  <h1>⚡ Lightning Admin</h1>

  <div class="row">
    <div class="label">Maintenance Mode</div>

    <div id="toggle" class="toggle" onclick="toggle()">
      <div class="circle"></div>
    </div>
  </div>

  <div id="status" class="status">Loading...</div>
</div>

<script>
const API = "https://silent-bar-041a.harrytestacc23.workers.dev";

let state = false;
let sha = "";

// Load state
async function load() {
  const res = await fetch(API + "/get");
  const data = await res.json();

  state = data.maintenance;
  sha = data.sha;

  updateUI();
}

// Toggle
async function toggle() {
  state = !state;

  const res = await fetch(API + "/set", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
      // "x-admin-key": "your-secret"
    },
    body: JSON.stringify({
      maintenance: state,
      sha: sha
    })
  });

  const data = await res.json();

  if (data.error) {
    alert("Error: " + data.error);
    return;
  }

  load();
}

// UI update
function updateUI() {
  const t = document.getElementById("toggle");
  const s = document.getElementById("status");

  if (state) {
    t.classList.add("on");
    t.classList.add("on-glow");
    s.innerText = "Maintenance is ENABLED";
  } else {
    t.classList.remove("on");
    t.classList.remove("on-glow");
    s.innerText = "Maintenance is DISABLED";
  }
}

load();
</script>

</body>
</html>
