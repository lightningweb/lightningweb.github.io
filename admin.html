<!DOCTYPE html>
<html>
<head>
<title>Lightning Admin</title>
<style>
body {
  font-family: Inter, sans-serif;
  background: #0a0f1f;
  color: white;
  text-align: center;
  padding-top: 100px;
}

.toggle {
  width: 80px;
  height: 40px;
  background: #222;
  border-radius: 20px;
  margin: 20px auto;
  position: relative;
  cursor: pointer;
}

.circle {
  width: 34px;
  height: 34px;
  background: white;
  border-radius: 50%;
  position: absolute;
  top: 3px;
  left: 3px;
  transition: 0.3s;
}

.on { background: limegreen; }
.on .circle { left: 43px; }
</style>
</head>

<body>

<h1>⚡ Lightning Admin</h1>

<div id="toggle" class="toggle" onclick="toggle()">
  <div class="circle"></div>
</div>

<p id="status">Loading...</p>

<script>
const API = "https://silent-bar-041a.harrytestacc23.workers.dev";

let state = false;
let sha = "";

// Load state
async function load() {
  const res = await fetch(API + "/get");
  const data = await res.json();

  state = data.maintenance;
  sha = data.sha;

  updateUI();
}

// Toggle
async function toggle() {
  state = !state;

  await fetch(API + "/set", {
    method: "POST",
    headers: {
      "Content-Type": "application/json"
    },
    body: JSON.stringify({
      maintenance: state,
      sha: sha
    })
  });

  updateUI();
}

// UI
function updateUI() {
  const t = document.getElementById("toggle");
  const s = document.getElementById("status");

  if (state) {
    t.classList.add("on");
    s.innerText = "Maintenance: ON";
  } else {
    t.classList.remove("on");
    s.innerText = "Maintenance: OFF";
  }
}

load();
</script>

</body>
</html>
